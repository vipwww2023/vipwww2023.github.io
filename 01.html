<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Qiniu-like Glow Background</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    // 场景设置
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 自定义着色器材质
    const material = new THREE.ShaderMaterial({
      uniforms: {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      },
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec2 u_resolution;
        uniform float u_time;

        // Hash function for pseudo-randomness
        float hash(float n) { return fract(sin(n) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i.x + i.y * 57.0), hash(i.x + 1.0 + i.y * 57.0), f.x),
            mix(hash(i.x + (i.y + 1.0) * 57.0), hash(i.x + 1.0 + (i.y + 1.0) * 57.0), f.x),
            f.y
          );
        }

        void main() {
          vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
          uv *= 1.5; // 缩放

          float t = u_time * 0.1;
          vec3 col = vec3(0.0);

          // 多层噪声叠加形成流动感
          col.r = 0.5 + 0.5 * sin(t + uv.x * 2.0 + noise(uv + t));
          col.g = 0.5 + 0.5 * sin(t * 0.7 + uv.y * 2.0 + noise(uv * 1.5 + t * 1.3));
          col.b = 0.5 + 0.5 * sin(t * 0.5 + length(uv) * 3.0 + noise(uv * 2.0 - t * 0.9));

          // 添加径向光晕
          float vignette = 1.0 - dot(uv, uv) * 0.8;
          col *= vignette;

          gl_FragColor = vec4(col, 0.9);
        }
      `,
      transparent: true,
      depthWrite: false
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    // 动画循环
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }
    animate();

    // 响应窗口大小变化
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      material.uniforms.u_resolution.value.set(w, h);
    });
  </script>
</body>
</html>
