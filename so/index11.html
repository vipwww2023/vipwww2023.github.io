<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI聚合搜索 - 聚搜天下</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style_ai.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="bg-animation" id="bgAnimation"></div>

  <header class="header">
    <div class="logo">AI聚合搜索</div>
    <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
  </header>

  <main class="main">
    <section class="search-section">
      <h1 class="search-title">AI聚合搜索</h1>
      <p class="search-subtitle">聚搜天下，智能呈现</p>

      <div class="search-box-container">
        <form action="https://www.baidu.com/s" method="get" target="_blank" id="super-search-fm">
          <div class="search-box">
            <input type="text" name="wd" id="search-text" class="search-input" placeholder="输入搜索内容..." autofocus>
            <button type="submit" class="search-button"><i class="fas fa-search"></i></button>
          </div>
        </form>
      </div>

      <div class="search-engines">
        <div class="engine-item active" data-url="https://www.baidu.com/s?wd="><span class="engine-icon" style="background:#2319dc;"></span>百度</div>
        <div class="engine-item" data-url="https://www.google.com/search?q="><span class="engine-icon" style="background:#4285f4;"></span>Google</div>
        <div class="engine-item" data-url="https://cn.bing.com/search?q="><span class="engine-icon" style="background:#00809d;"></span>Bing</div>
        <div class="engine-item" data-url="https://www.sogou.com/web?query="><span class="engine-icon" style="background:#f94c00;"></span>搜狗</div>
        <div class="engine-item" data-url="https://www.so.com/s?q="><span class="engine-icon" style="background:#19b955;"></span>360</div>
      </div>

      <div class="search-type-tabs">
        <button class="type-tab active" data-type="common">常用</button>
        <button class="type-tab" data-type="image">图片</button>
        <button class="type-tab" data-type="music">音乐</button>
        <button class="type-tab" data-type="video">影视</button>
        <button class="type-tab" data-type="shop">购物</button>
        <button class="type-tab" data-type="tool">工具</button>
      </div>

      <div class="search-hot-text" id="box" style="display:none;">
        <ul></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2024 AI聚合搜索. All rights reserved.</p>
  </footer>

  <script src="js/sou_ai.js"></script>
</body>
</html>
